<title>EV Showroom Guide</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f9;--card:#fff;--text:#14232b;--muted:#5a6b75;--line:#d8e1e6;--accent:#0b8fb5;--at:#fff;--ok:#1f7a45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#16252d;--text:#e6eef2;--muted:#9bb0ba;--line:#26383f;--accent:#46c3e6;--at:#06242d;--ok:#4cc27f}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#16252d;--text:#e6eef2;--muted:#9bb0ba;--line:#26383f;--accent:#46c3e6;--at:#06242d;--ok:#4cc27f}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.55;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Kannada","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu",sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 36px}
h1{font-size:1.4rem;margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 15px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--at);border-color:var(--accent);font-weight:600}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:6px}
.row{display:flex;gap:12px;align-items:flex-start}
#staff{flex:0 0 100px;width:100px;height:auto}
.shirt{fill:var(--accent)}
.bubble{position:relative;flex:1;min-height:150px;border:2px solid var(--accent);border-radius:16px;padding:12px 14px;font-size:1.02rem}
.bubble:before{content:"";position:absolute;left:-9px;top:28px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}
#mouth,#sg{transform-box:fill-box;transform-origin:center}
.talk #mouth{animation:m .25s infinite alternate}
.talk #sg{animation:bob .7s ease-in-out infinite alternate}
@keyframes m{to{transform:scaleY(2.4)}}@keyframes bob{to{transform:translateY(-3px)}}
.vs{width:100%;height:auto;color:var(--text);margin-top:14px}
.vs{border-radius:12px;background:#000}
.hs{fill:#2aa7ff;fill-opacity:.3;stroke:#46c3e6;stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:center}
.hs.on{opacity:1;animation:pu 1s infinite}
@keyframes pu{50%{transform:scale(1.25)}}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.parts span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.parts span.on{background:var(--accent);color:var(--at);border-color:var(--accent);font-weight:600}
#go{width:100%;background:var(--accent);color:var(--at);border:0;border-radius:12px;padding:13px;font-size:1.05rem;font-weight:700;cursor:pointer}
#go.on{background:var(--ok);color:#fff}
.foot{font-size:.8rem;color:var(--muted);margin-top:14px}

<script>
var L={"en":{"n":"English","v":"en-IN","t":"EV Basics Guide","s":"Simple answers for first-time EV customers","l":"Listen","x":"Stop","nv":"No voice for this language on this phone. Text is shown only.","c":[["What is an EV?","An electric vehicle runs on a battery and an electric motor instead of petrol or diesel. It makes no exhaust smoke and is quiet to drive."],["How do you charge it?","Plug the car into a charging station, like charging a phone. Home charging is slow. A fast public charger can fill most of the battery in about an hour."],["Is charging safe in rain?","Yes. EVs and chargers are built to be waterproof and cut power if a fault is found. Avoid any station that shows flood or water around it."],["How far can it go?","Most EVs in India go roughly 200 to 450 km on one full charge, depending on the car, speed and traffic."],["Is it cheaper to run?","Usually yes. Electricity costs much less per km than petrol or diesel, and servicing is simpler because there are fewer moving parts."]]},"kn":{"n":"ಕನ್ನಡ","v":"kn-IN","t":"EV ಮೂಲ ಮಾಹಿತಿ","s":"ಮೊದಲ ಬಾರಿ EV ಖರೀದಿಸುವವರಿಗೆ ಸರಳ ಉತ್ತರಗಳು","l":"ಕೇಳಿ","x":"ನಿಲ್ಲಿಸಿ","nv":"ಈ ಫೋನ್‌ನಲ್ಲಿ ಈ ಭಾಷೆಯ ಧ್ವನಿ ಇಲ್ಲ. ಪಠ್ಯ ಮಾತ್ರ ತೋರಿಸಲಾಗಿದೆ.","c":[["EV ಎಂದರೇನು?","ಎಲೆಕ್ಟ್ರಿಕ್ ವಾಹನವು ಪೆಟ್ರೋಲ್ ಅಥವಾ ಡೀಸೆಲ್ ಬದಲು ಬ್ಯಾಟರಿ ಮತ್ತು ಎಲೆಕ್ಟ್ರಿಕ್ ಮೋಟಾರ್‌ನಿಂದ ಓಡುತ್ತದೆ. ಹೊಗೆ ಬರುವುದಿಲ್ಲ, ಶಬ್ದವೂ ಕಡಿಮೆ."],["ಚಾರ್ಜ್ ಮಾಡುವುದು ಹೇಗೆ?","ಫೋನ್ ಚಾರ್ಜ್ ಮಾಡಿದಂತೆ ಕಾರನ್ನು ಚಾರ್ಜಿಂಗ್ ಸ್ಟೇಷನ್‌ಗೆ ಪ್ಲಗ್ ಮಾಡಿ. ಮನೆಯಲ್ಲಿ ಚಾರ್ಜಿಂಗ್ ನಿಧಾನ. ವೇಗದ ಸಾರ್ವಜನಿಕ ಚಾರ್ಜರ್ ಸುಮಾರು ಒಂದು ಗಂಟೆಯಲ್ಲಿ ಹೆಚ್ಚಿನ ಬ್ಯಾಟರಿ ತುಂಬಿಸುತ್ತದೆ."],["ಮಳೆಯಲ್ಲಿ ಚಾರ್ಜಿಂಗ್ ಸುರಕ್ಷಿತವೇ?","ಹೌದು. EV ಮತ್ತು ಚಾರ್ಜರ್‌ಗಳು ಜಲನಿರೋಧಕವಾಗಿರುತ್ತವೆ ಮತ್ತು ದೋಷ ಕಂಡರೆ ವಿದ್ಯುತ್ ಕಡಿತಗೊಳಿಸುತ್ತವೆ. ಪ್ರವಾಹ ಅಥವಾ ನೀರು ನಿಂತಿರುವ ಸ್ಟೇಷನ್‌ನಲ್ಲಿ ಚಾರ್ಜ್ ಮಾಡಬೇಡಿ."],["ಒಮ್ಮೆ ಚಾರ್ಜ್ ಮಾಡಿದರೆ ಎಷ್ಟು ದೂರ?","ಭಾರತದ ಹೆಚ್ಚಿನ EV ಗಳು ಒಂದು ಪೂರ್ಣ ಚಾರ್ಜ್‌ನಲ್ಲಿ ಸುಮಾರು 200 ರಿಂದ 450 ಕಿಮೀ ಓಡುತ್ತವೆ. ಇದು ಕಾರು, ವೇಗ ಮತ್ತು ಟ್ರಾಫಿಕ್ ಮೇಲೆ ಅವಲಂಬಿತ."],["ನಡೆಸಲು ಅಗ್ಗವೇ?","ಸಾಮಾನ್ಯವಾಗಿ ಹೌದು. ಪ್ರತಿ ಕಿಮೀಗೆ ವಿದ್ಯುತ್ ವೆಚ್ಚ ಪೆಟ್ರೋಲ್, ಡೀಸೆಲ್‌ಗಿಂತ ಕಡಿಮೆ, ಮತ್ತು ಭಾಗಗಳು ಕಡಿಮೆ ಇರುವುದರಿಂದ ಸರ್ವಿಸ್ ಸುಲಭ."]]},"hi":{"n":"हिन्दी","v":"hi-IN","t":"EV की बुनियादी जानकारी","s":"पहली बार EV लेने वालों के लिए आसान जवाब","l":"सुनें","x":"रोकें","nv":"इस फ़ोन में इस भाषा की आवाज़ नहीं है। सिर्फ़ टेक्स्ट दिख रहा है।","c":[["EV क्या है?","इलेक्ट्रिक वाहन पेट्रोल या डीज़ल की जगह बैटरी और इलेक्ट्रिक मोटर से चलता है। इसमें धुआँ नहीं निकलता और यह शांत चलता है।"],["चार्ज कैसे करें?","गाड़ी को चार्जिंग स्टेशन में लगाइए, जैसे फ़ोन चार्ज करते हैं। घर पर चार्जिंग धीमी होती है। तेज़ पब्लिक चार्जर लगभग एक घंटे में ज़्यादातर बैटरी भर देता है।"],["बारिश में चार्जिंग सुरक्षित है?","हाँ। EV और चार्जर वॉटरप्रूफ बनाए जाते हैं और गड़बड़ी मिलने पर बिजली काट देते हैं। जिस स्टेशन पर बाढ़ या पानी भरा दिखे, वहाँ चार्ज न करें।"],["एक बार में कितनी दूर चलेगी?","भारत में ज़्यादातर EV एक पूरे चार्ज में लगभग 200 से 450 किमी चलती हैं। यह गाड़ी, रफ़्तार और ट्रैफ़िक पर निर्भर करता है।"],["क्या चलाना सस्ता है?","आमतौर पर हाँ। बिजली का खर्च पेट्रोल या डीज़ल से प्रति किमी बहुत कम है, और पुर्ज़े कम होने से सर्विसिंग आसान है।"]]},"ta":{"n":"தமிழ்","v":"ta-IN","t":"EV அடிப்படை வழிகாட்டி","s":"முதல் முறை EV வாங்குவோருக்கான எளிய பதில்கள்","l":"கேளுங்கள்","x":"நிறுத்து","nv":"இந்த போனில் இந்த மொழிக்கான குரல் இல்லை. உரை மட்டும் காட்டப்படுகிறது.","c":[["EV என்றால் என்ன?","மின்சார வாகனம் பெட்ரோல் அல்லது டீசலுக்குப் பதிலாக பேட்டரி மற்றும் மின்சார மோட்டாரால் ஓடுகிறது. புகை வெளியாகாது, சத்தமும் குறைவு."],["எப்படி சார்ஜ் செய்வது?","போனை சார்ஜ் செய்வது போல காரை சார்ஜிங் ஸ்டேஷனில் செருகவும். வீட்டில் சார்ஜிங் மெதுவானது. வேகமான பொது சார்ஜர் சுமார் ஒரு மணி நேரத்தில் பெரும்பாலான பேட்டரியை நிரப்பும்."],["மழையில் சார்ஜ் செய்வது பாதுகாப்பானதா?","ஆம். EV மற்றும் சார்ஜர்கள் நீர்புகாதவையாக உருவாக்கப்படுகின்றன. கோளாறு தெரிந்தால் மின்சாரத்தை நிறுத்தும். வெள்ளம் அல்லது தண்ணீர் தேங்கிய ஸ்டேஷனில் சார்ஜ் செய்ய வேண்டாம்."],["ஒரு முறை சார்ஜில் எவ்வளவு தூரம்?","இந்தியாவில் பெரும்பாலான EV கள் முழு சார்ஜில் சுமார் 200 முதல் 450 கிமீ ஓடும். இது கார், வேகம், போக்குவரத்தைப் பொறுத்தது."],["ஓட்டுவதற்கு மலிவானதா?","பொதுவாக ஆம். ஒரு கிமீக்கு மின்சாரச் செலவு பெட்ரோல், டீசலை விடக் குறைவு. பாகங்கள் குறைவு என்பதால் சர்வீஸும் எளிது."]]},"te":{"n":"తెలుగు","v":"te-IN","t":"EV ప్రాథమిక గైడ్","s":"మొదటిసారి EV కొనేవారికి సులభమైన సమాధానాలు","l":"వినండి","x":"ఆపండి","nv":"ఈ ఫోన్‌లో ఈ భాషకు వాయిస్ లేదు. టెక్స్ట్ మాత్రమే చూపబడింది.","c":[["EV అంటే ఏమిటి?","ఎలక్ట్రిక్ వాహనం పెట్రోల్ లేదా డీజిల్ బదులు బ్యాటరీ మరియు ఎలక్ట్రిక్ మోటార్‌తో నడుస్తుంది. పొగ రాదు, శబ్దం కూడా తక్కువ."],["ఛార్జ్ ఎలా చేయాలి?","ఫోన్ ఛార్జ్ చేసినట్టే కారును ఛార్జింగ్ స్టేషన్‌లో ప్లగ్ చేయండి. ఇంట్లో ఛార్జింగ్ నెమ్మదిగా ఉంటుంది. వేగవంతమైన పబ్లిక్ ఛార్జర్ సుమారు ఒక గంటలో ఎక్కువ బ్యాటరీని నింపుతుంది."],["వర్షంలో ఛార్జింగ్ సురక్షితమేనా?","అవును. EV లు, ఛార్జర్లు వాటర్‌ప్రూఫ్‌గా తయారవుతాయి, లోపం కనిపిస్తే విద్యుత్‌ను నిలిపివేస్తాయి. వరద లేదా నీరు నిలిచిన స్టేషన్‌లో ఛార్జ్ చేయకండి."],["ఒకసారి ఛార్జ్ చేస్తే ఎంత దూరం?","భారతదేశంలో చాలా EV లు ఒక పూర్తి ఛార్జ్‌తో సుమారు 200 నుండి 450 కిమీ వెళ్తాయి. ఇది కారు, వేగం, ట్రాఫిక్‌పై ఆధారపడి ఉంటుంది."],["నడపడానికి చౌకేనా?","సాధారణంగా అవును. కిమీకి విద్యుత్ ఖర్చు పెట్రోల్, డీజిల్ కంటే తక్కువ. భాగాలు తక్కువ కాబట్టి సర్వీసింగ్ సులభం."]]}};
var G={en:"Hello! Let me explain EVs in a simple way.",kn:"ನಮಸ್ಕಾರ! EV ಬಗ್ಗೆ ಸರಳವಾಗಿ ಹೇಳುತ್ತೇನೆ.",hi:"नमस्ते! मैं आपको EV के बारे में आसान भाषा में बताता हूँ।",ta:"வணக்கம்! EV பற்றி எளிமையாகச் சொல்கிறேன்.",te:"నమస్కారం! EV గురించి సులభంగా చెబుతాను."};

  step=s;draw();var t=txt(s);s++;say(t,L[cur].v,function(){if(g===gen)go()})}
 go()}
function setVeh(){var v=VEH[veh],h="";PK.forEach(function(k){v.pts[k].forEach(function(p){h+='<circle class="hs" data-p="'+k+'" cx="'+p[0]+'" cy="'+p[1]+'" r="'+v.r+'"/>'})});
 document.getElementById("vsvg").innerHTML='<svg class="vs" viewBox="0 0 '+v.w+' '+v.h+'"><image href="'+v.img+'" width="'+v.w+'" height="'+v.h+'"/>'+h+'</svg>'}
function chips(id,items,sel,fn){var e=document.getElementById(id);e.innerHTML="";items.forEach(function(it){var b=document.createElement("button");b.textContent=it[1];b.setAttribute("aria-pressed",it[0]===sel);b.onclick=function(){fn(it[0])};e.appendChild(b)})}
function draw(){
 var d=L[cur],f=step>=0?FOC[step]:[];
 document.documentElement.lang=cur;
 document.getElementById("title").textContent=d.t;
 chips("langs",Object.keys(L).map(function(k){return[k,L[k].n]}),cur,function(k){stopAll();step=-1;cur=k;draw()});
 chips("veh",Object.keys(VEH).map(function(k){return[k,VEH[k].n]}),veh,function(k){veh=k;setVeh();draw()});
 document.getElementById("bubble").textContent=txt(step>=0?step:0);
 document.getElementById("stage").className="stage"+(speaking?" talk":"");
 var p=document.getElementById("parts");p.innerHTML="";
 PK.forEach(function(k,i){var s=document.createElement("span");s.textContent=PL[cur][i];if(f.indexOf(k)>-1)s.className="on";p.appendChild(s)});
 var hs=document.querySelectorAll(".hs");for(var j=0;j<hs.length;j++){hs[j].setAttribute("class","hs"+(f.indexOf(hs[j].getAttribute("data-p"))>-1?" on":""))}
 var b=document.getElementById("go");b.textContent=speaking?"\u25a0 "+d.x:"\u25b6 "+d.l;b.className=speaking?"on":""}
document.getElementById("go").onclick=run;
setVeh();draw();
</script></body></html>
